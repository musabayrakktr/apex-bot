<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX Bot Terminal</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151921;
            --border-color: #232936;
            --accent-color: #00e676;
            --text-main: #f0f4f8;
            --text-sub: #8a96a3;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            color: #00b0ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-badge {
            background: rgba(0, 230, 118, 0.1);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        .card-title {
            color: var(--text-sub);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .val-usdt {
            font-size: 32px;
            font-weight: bold;
            color: #ffffff;
        }

        .val-try {
            font-size: 18px;
            color: var(--accent-color);
            margin-top: 5px;
            font-weight: 600;
        }

        .chart-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        .chart-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            overflow-x: auto;
        }

        .tab-btn {
            background: #1c222d;
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .tab-btn.active, .tab-btn:hover {
            background: #00b0ff;
            color: #fff;
            border-color: #00b0ff;
        }

        .tv-container {
            height: 500px;
            border-radius: 8px;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚡ APEX BOT TERMINAL</h1>
        <div class="status-badge">● SİSTEM AKTİF</div>
    </div>

    <div class="grid-container">
        <!-- Canlı Kasa Kartı (USDT + TRY) -->
        <div class="card">
            <div class="card-title">💰 TOPLAM KASA VARLIĞI</div>
            <div class="val-usdt" id="usdt-val">Yükleniyor...</div>
            <div class="val-try" id="try-val">₺ -- TRY</div>
        </div>

        <!-- Dolar Kuru Card -->
        <div class="card">
            <div class="card-title">💱 ANLIK USDT / TRY KURU</div>
            <div class="val-usdt" id="rate-val">₺34.20</div>
            <div style="color: var(--text-sub); font-size: 12px; margin-top: 5px;">OKX TR Canlı Fiyat</div>
        </div>

        <!-- Motor Kapasitesi -->
        <div class="card">
            <div class="card-title">📊 ALIM KAPASİTESİ</div>
            <div class="val-usdt">5 Parite</div>
            <div style="color: var(--accent-color); font-size: 14px; margin-top: 5px;">Coin Başı ~5.0 USDT</div>
        </div>
    </div>

    <!-- TradingView Canlı Mum Grafikleri -->
    <div class="chart-section">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
            <h3 style="margin:0; font-size: 16px;">📈 TRADINGVIEW CANLI GRAFİK MOTORU</h3>
            <div class="chart-tabs">
                <button class="tab-btn active" onclick="loadChart('OKX:BTCUSDT')">BTC/USDT</button>
                <button class="tab-btn" onclick="loadChart('OKX:ETHUSDT')">ETH/USDT</button>
                <button class="tab-btn" onclick="loadChart('OKX:SOLUSDT')">SOL/USDT</button>
                <button class="tab-btn" onclick="loadChart('OKX:AVAXUSDT')">AVAX/USDT</button>
                <button class="tab-btn" onclick="loadChart('OKX:XRPUSDT')">XRP/USDT</button>
            </div>
        </div>
        
        <div id="tradingview_widget" class="tv-container"></div>
    </div>

    <!-- TradingView Script -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
        let currentSymbol = 'OKX:BTCUSDT';

        function loadChart(symbol) {
            currentSymbol = symbol;
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if(btn.getAttribute('onclick').includes(symbol)) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            new TradingView.widget({
                "autosize": true,
                "symbol": symbol,
                "interval": "5",
                "timezone": "Europe/Istanbul",
                "theme": "dark",
                "style": "1",
                "locale": "tr",
                "toolbar_bg": "#f1f3f6",
                "enable_publishing": false,
                "hide_side_toolbar": false,
                "container_id": "tradingview_widget"
            });
        }

        function updateBalance() {
            fetch('/api/status')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('usdt-val').innerText = data.usdt + ' USDT';
                    document.getElementById('try-val').innerText = '₺' + data.try + ' TRY';
                    document.getElementById('rate-val').innerText = '₺' + data.try_rate;
                })
                .catch(err => console.log(err));
        }

        loadChart('OKX:BTCUSDT');
        updateBalance();
        setInterval(updateBalance, 5000);
    </script>
</body>
</html>
