<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX AI Terminal & RSI Radar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0d1117; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-custom { background: #161b22; border: 1px solid #30363d; border-radius: 12px; }
        .text-neon-green { color: #00f2fe; }
        .text-bright { color: #f0f6fc; }
        .coin-btn { background: #21262d; border: 1px solid #30363d; color: #fff; font-weight: 600; padding: 5px 15px; border-radius: 6px; }
        .coin-btn:hover, .coin-btn.active { background: #238636; border-color: #2ea043; color: #fff; }
    </style>
</head>
<body class="p-3">
    <div class="container-fluid">
        <!-- HEADER -->
        <div class="d-flex justify-content-between align-items-center mb-4 p-3 card-custom">
            <div>
                <h3 class="m-0 text-neon-green fw-bold">⚡ APEX RSI KESİŞİM TERMINALİ</h3>
                <small class="text-bright">Canlı RSI & Hedef Alım Çizgisi Takibi</small>
            </div>
            <div>
                <span class="badge bg-success p-2 fs-6" id="cross-status">🟢 Kesişim Aranıyor</span>
            </div>
        </div>

        <!-- GRAFİK SEÇİMİ VE RSI KESİŞİM CANLI CANVAS -->
        <div class="card-custom p-4 mb-4">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                <div>
                    <h5 class="fw-bold m-0 text-bright" id="chart-title">📊 SOL/USDT - Canlı RSI & Alım Eşiği Kesişimi</h5>
                    <small class="text-muted">Yeşil Çizgi: Hedef Alım RSI | Mavi Çizgi: Anlık RSI</small>
                </div>
                <div class="btn-group" role="group">
                    <button class="coin-btn active" onclick="selectCoin('SOL/USDT')">SOL</button>
                    <button class="coin-btn" onclick="selectCoin('BTC/USDT')">BTC</button>
                    <button class="coin-btn" onclick="selectCoin('ETH/USDT')">ETH</button>
                    <button class="coin-btn" onclick="selectCoin('AVAX/USDT')">AVAX</button>
                    <button class="coin-btn" onclick="selectCoin('XRP/USDT')">XRP</button>
                </div>
            </div>

            <!-- CANLI RSI VE KESİŞİM GRAFİĞİ -->
            <div style="height: 380px; position: relative;">
                <canvas id="rsiIntersectionChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        let currentSymbol = "SOL/USDT";
        let targetRsiLevel = 35.0; // Hedef Alım Eşiği

        // Zaman Etiketleri ve RSI Canlı Veri Dizisi
        const timeLabels = ['03:30', '03:31', '03:32', '03:33', '03:34', '03:35', '03:36', '03:37'];
        const liveRsiData = [48.2, 45.0, 42.1, 39.5, 36.8, 34.2, 33.0, 32.5]; 
        const targetRsiData = Array(timeLabels.length).fill(targetRsiLevel);

        const ctx = document.getElementById('rsiIntersectionChart').getContext('2d');
        const rsiChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: timeLabels,
                datasets: [
                    {
                        label: 'Anlık Canlı RSI',
                        data: liveRsiData,
                        borderColor: '#00f2fe',
                        backgroundColor: 'rgba(0, 242, 254, 0.1)',
                        borderWidth: 3,
                        tension: 0.3,
                        fill: false
                    },
                    {
                        label: 'Hedef Alım Seviyesi (RSI ' + targetRsiLevel + ')',
                        data: targetRsiData,
                        borderColor: '#00c853',
                        borderWidth: 2,
                        borderDash: [6, 6], // Kesikli alım çizgisi
                        pointRadius: 0,
                        fill: false
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        min: 10,
                        max: 90,
                        grid: { color: '#21262d' },
                        ticks: { color: '#8b949e' }
                    },
                    x: {
                        grid: { color: '#21262d' },
                        ticks: { color: '#8b949e' }
                    }
                },
                plugins: {
                    legend: { labels: { color: '#f0f6fc' } }
                }
            }
        });

        function selectCoin(symbol) {
            currentSymbol = symbol;
            document.getElementById('chart-title').innerText = `📊 ${symbol} - Canlı RSI & Alım Eşiği Kesişimi`;
            document.querySelectorAll('.coin-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
